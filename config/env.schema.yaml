version: 1
variables:
  GOFEATHERROUTE_CONFIG_FILE: {type: path, required: false, description: "Path to YAML configuration."}
  GOFEATHERROUTE_ADDR: {type: string, required: false, description: "HTTP listen address."}
  GOFEATHERROUTE_LOG_LEVEL: {type: string, required: false, description: "Log level: debug, info, warn, or error."}
  GOFEATHERROUTE_REQUEST_TIMEOUT: {type: duration, required: false, description: "Maximum upstream request duration."}
  GOFEATHERROUTE_STREAM_IDLE_TIMEOUT: {type: duration, required: false, description: "Maximum time between streamed upstream bytes."}
  GOFEATHERROUTE_MAX_BODY_BYTES: {type: integer, required: false, description: "Maximum incoming request body size."}
  GOFEATHERROUTE_MAX_RESPONSE_BYTES: {type: integer, required: false, description: "Maximum upstream response size."}
  GOFEATHERROUTE_MAX_CONCURRENT_REQUESTS: {type: integer, required: false, description: "Maximum concurrent requests."}
  GOFEATHERROUTE_MAX_CONCURRENT_STREAMS: {type: integer, required: false, description: "Maximum concurrent streaming requests."}
  GOFEATHERROUTE_ALLOW_INSECURE_HTTP: {type: boolean, required: false, description: "Benchmark-only HTTP fake-provider opt-in; never enable in production."}
  GOFEATHERROUTE_API_KEY: {type: secret, required: false, description: "Incoming gateway bearer token."}
  OPENAI_API_KEY: {type: secret, required: false, description: "OpenAI provider key."}
  DEEPSEEK_API_KEY: {type: secret, required: false, description: "DeepSeek provider key."}
