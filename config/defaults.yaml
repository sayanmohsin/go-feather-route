server:
  address: ":4000"
  diagnostics_address: ""
  log_level: "info"
  request_timeout: "60s"
  stream_idle_timeout: "30s"
  max_body_bytes: 1048576
  max_response_bytes: 8388608
  max_concurrent_requests: 16
  max_concurrent_embeddings: 2
  max_concurrent_streams: 4

auth:
  api_key_env: "GOFEATHERROUTE_API_KEY"

usage:
  endpoint: ""
  api_key_env: "GOFEATHERROUTE_USAGE_API_KEY"
  timeout: "2s"

providers:
  openai:
    base_url: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    kind: "openai-compatible"
  deepseek:
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
    kind: "openai-compatible"
  ollama:
    base_url: "http://127.0.0.1:11434/v1"
    api_key_env: "OLLAMA_API_KEY"
    kind: "ollama"

model_list:
  - model_name: gpt-4o-mini
    provider: openai
    upstream_model: gpt-4o-mini
    input_cost_per_million_tokens: 0
    output_cost_per_million_tokens: 0
    embedding_cost_per_million_tokens: 0
  - model_name: deepseek-chat
    provider: deepseek
    upstream_model: deepseek-chat
  - model_name: ollama-qwen3
    provider: ollama
    upstream_model: qwen3:4b
  - model_name: ollama-nomic-embed
    provider: ollama
    upstream_model: nomic-embed-text

route_rules:
  - match: "deepseek/*"
    provider: deepseek
  - match: "ollama/*"
    provider: ollama
  - match: "openai/*"
    provider: openai
