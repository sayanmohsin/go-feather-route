openapi: 3.1.0
info:
  title: Go Feather Route API
  version: 0.1.0
  description: OpenAI-compatible model routing and operational endpoints.
servers:
  - url: http://127.0.0.1:4000
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /health/liveliness:
    get:
      operationId: healthLiveliness
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /ready:
    get:
      operationId: readiness
      security: []
      responses:
        '200': { description: At least one model route is ready. }
        '503': { description: No configured provider credentials. }
  /status:
    get:
      operationId: gatewayStatus
      security: []
      responses:
        '200': { description: Gateway counters and model count. }
  /status/models:
    get:
      operationId: modelStatusList
      responses:
        '200': { description: Configured model aliases. }
  /status/models/{model}:
    get:
      operationId: modelStatus
      parameters:
        - $ref: '#/components/parameters/Model'
      responses:
        '200': { description: Model route status. }
        '404': { $ref: '#/components/responses/NotFound' }
  /metrics:
    get:
      operationId: metrics
      security: []
      responses:
        '200': { description: Prometheus-compatible counters. }
  /v1/models:
    get:
      operationId: listModels
      responses:
        '200':
          description: Configured model aliases.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelList' }
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Chat completion or text/event-stream when stream is true.
          content:
            application/json: { schema: { type: object } }
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: Request body is too large. }
        '502': { description: Provider request failed. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Model:
      name: model
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    Unauthorized:
      description: Missing or invalid gateway token.
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
    NotFound:
      description: Model is not configured.
      content:
        application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } }
  schemas:
    Health:
      type: object
      required: [object, status]
      properties:
        object: { type: string, example: health }
        status: { type: string, example: ok }
    Model:
      type: object
      required: [id, object, owned_by]
      properties:
        id: { type: string }
        object: { type: string, example: model }
        owned_by: { type: string }
    ModelList:
      type: object
      required: [object, data]
      properties:
        object: { type: string, example: list }
        data: { type: array, items: { $ref: '#/components/schemas/Model' } }
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages: { type: array, items: { type: object } }
        stream: { type: boolean, default: false }
      additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type: { type: string, example: go_feather_route_error }
